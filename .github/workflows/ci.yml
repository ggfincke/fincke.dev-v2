name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun run ci:check
      - run: bunx playwright install --with-deps chromium
      # previews the dist that ci:check just built, so the browser checks
      # cover the same bundle
      - name: Run browser route checks
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap "kill $preview_pid" EXIT
          BASE_URL=http://127.0.0.1:4173 bun run browser:check
      - name: Upload browser verification artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-verification-artifacts
          path: |
            reports/
            screenshots/smoke/
          if-no-files-found: ignore
