name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun run ci:check
      - run: bunx playwright install --with-deps chromium
      # previews the dist that ci:check just built, so the browser checks
      # cover the same bundle
      - name: Run browser route checks
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap "kill $preview_pid" EXIT
          BASE_URL=http://127.0.0.1:4173 bun run browser:check
      - name: Upload browser verification artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-verification-artifacts
          path: |
            reports/
            screenshots/smoke/
          if-no-files-found: ignore
